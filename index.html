<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOR 리포트 차트 프레임 도구</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #F5F5F3;
    color: #1a1a1a;
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px 0; }
  .sub { font-size: 13px; color: #666; margin-bottom: 24px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #ddd; margin-bottom: 20px; }
  .tab { padding: 10px 18px; background: transparent; border: none; border-bottom: 2px solid transparent; font-size: 14px; font-family: inherit; color: #666; cursor: pointer; margin-bottom: -1px; }
  .tab.active { color: #000; font-weight: 600; border-bottom-color: #000; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 24px; }
  .controls { background: white; border: 1px solid #e5e5e5; border-radius: 6px; padding: 20px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #333; }
  input[type="text"], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d1d1; border-radius: 4px; font-family: inherit; font-size: 13px; }
  textarea { font-family: 'Courier New', monospace; font-size: 11px; resize: vertical; }
  input[type="file"] { font-size: 12px; }
  .hint { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.4; }
  .hint code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 10px; }
  .btn { display: block; width: 100%; padding: 12px; background: #0A0A0C; color: white; border: none; border-radius: 4px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 8px; }
  .btn:hover { background: #222; }
  .btn-small { display: inline-block; padding: 4px 10px; background: #f0f0f0; color: #333; border: 1px solid #ddd; border-radius: 3px; font-size: 11px; cursor: pointer; font-family: inherit; margin-right: 4px; margin-top: 4px; }
  .btn-small:hover { background: #e5e5e5; }
  .preview-wrap { background: white; border: 1px solid #e5e5e5; border-radius: 6px; padding: 16px; }
  .preview-label { font-size: 11px; color: #999; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .preview { background: #E8E8E8; padding: 12px; border-radius: 4px; }
  .preview svg { width: 100%; height: auto; display: block; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .height-row { display: flex; gap: 8px; align-items: center; }
  .height-row select { flex: 1; }
  .color-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .color-row input[type="color"] { flex: 0 0 42px; width: 42px; height: 34px; padding: 2px; border: 1px solid #d1d1d1; border-radius: 4px; background: white; cursor: pointer; }
  .color-row input[type="text"] { flex: 1 1 auto; width: auto; min-width: 0; font-family: 'Courier New', monospace; }
  .color-row input[type="text"].invalid { border-color: #d33; background: #fff5f5; }
</style>
</head>
<body>
<div class="container">
  <h1>HOR 리포트 차트 프레임 도구</h1>
  <div class="sub">디자인 시안 기반. 데이터/이미지를 넣으면 HOR 프레임으로 감싼 SVG/PNG를 다운로드합니다.</div>

  <div class="tabs">
    <button class="tab active" data-tab="image">이미지 감싸기</button>
    <button class="tab" data-tab="chart">데이터로 차트</button>
    <button class="tab" data-tab="table">데이터로 표</button>
  </div>

  <div class="layout">
    <div class="controls">
      <div class="field">
        <label>제목</label>
        <input type="text" id="title" placeholder="예: 폴리마켓과 칼시의 반기별 거래량">
      </div>
      <div class="field">
        <label>부제</label>
        <input type="text" id="subtitle" placeholder="예: 2023 Q3 ~ 2025 Q3">
      </div>
      <div class="field">
        <label>포인트 색 (Key Color)</label>
        <select id="accentPreset">
          <option value="#2332DC">파랑 (HOR Blue)</option>
          <option value="#0A0A0C">검정</option>
          <option value="custom">직접 입력</option>
        </select>
        <div class="color-row">
          <input type="color" id="accentColor" value="#2332DC" aria-label="색상 선택">
          <input type="text" id="accentText" value="#2332DC" spellcheck="false" placeholder="#2332DC" aria-label="Hex 또는 RGB 값">
        </div>
        <div class="hint">좌측 세로 바와 표 헤더에 적용됩니다.<br>
          <code>#2332DC</code> <code>2332DC</code> <code>#23D</code> <code>rgb(35,50,220)</code> 모두 인식합니다.</div>
      </div>
      <div class="row">
        <div class="field">
          <label>Source</label>
          <input type="text" id="source" placeholder="예: Polymarket, Kalshi (자동 줄바꿈)">
        </div>
        <div class="field">
          <label>날짜 (선택)</label>
          <input type="text" id="date" placeholder="예: 2026.03">
        </div>
      </div>

      <div id="tab-image" class="tab-panel">
        <div class="field">
          <label>차트 이미지 업로드</label>
          <input type="file" id="imgUpload" accept="image/*">
          <div class="hint">PNG, JPG, SVG 등. 원본 비율 유지하며 프레임 안에 들어감.</div>
        </div>
      </div>

      <div id="tab-chart" class="tab-panel" style="display:none;">
        <div class="field">
          <label>차트 종류</label>
          <select id="chartType">
            <option value="line">Line (선 차트)</option>
            <option value="area">Area (영역 차트)</option>
            <option value="bar">Bar (막대 차트)</option>
          </select>
        </div>
        <div class="field">
          <label>데이터 (CSV / TSV)</label>
          <textarea id="chartData" rows="10">Month,Polymarket,Kalshi
H1 2023,0.03,0.2
H2 2023,0.04,0.6
H1 2024,0.5,0.6
H2 2024,8,1
H1 2025,5,5
H2 2025,15,18</textarea>
          <div class="hint">첫 줄: 헤더 (첫 컬럼 = X축 라벨, 나머지 = 시리즈). 쉼표 또는 탭 구분.</div>
          <button class="btn-small" onclick="loadSample('line1')">샘플: 시계열</button>
          <button class="btn-small" onclick="loadSample('bar1')">샘플: 범주</button>
        </div>
      </div>

      <div id="tab-table" class="tab-panel" style="display:none;">
        <div class="field">
          <label>표 데이터</label>
          <textarea id="tableData" rows="10">주체,수익원,비고,수수료 비중
발급사(은행),발급사 몫의 수수료,주된 규제 대상. 산업 위험을 짐.,약 70-80%
네트워크,네트워크 수수료와 부가서비스,가장 영속적이고 구조적 지대.,약 7-9%
매입사,매입 마진,경쟁이 치열해 상충되기 편해짐.,약 3-15%</textarea>
          <div class="hint">첫 줄: 헤더. 셀 안에서 <code>|</code>를 넣으면 강제 줄바꿈. 셀 폭을 넘으면 자동 줄바꿈됨.</div>
        </div>
        <div class="field">
          <label>행 높이</label>
          <div class="height-row">
            <select id="tableDensity">
              <option value="compact">Compact (촘촘)</option>
              <option value="normal">Normal (표준)</option>
              <option value="relaxed" selected>Relaxed (여유)</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn" onclick="downloadPNG()">PNG 다운로드 (2× 고해상도)</button>
      <button class="btn" onclick="downloadSVG()" style="background:#666; margin-top:8px;">SVG 다운로드 (인쇄용)</button>
    </div>

    <div class="preview-wrap">
      <div class="preview-label" id="previewLabel">Preview</div>
      <div class="preview" id="preview"></div>
    </div>
  </div>
</div>

function darken(hex, factor) {
  const h = String(hex).replace('#', '');
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  const dr = Math.max(0, Math.floor(r * factor));
  const dg = Math.max(0, Math.floor(g * factor));
  const db = Math.max(0, Math.floor(b * factor));
  return '#' +
    dr.toString(16).padStart(2, '0') +
    dg.toString(16).padStart(2, '0') +
    db.toString(16).padStart(2, '0');
}

let currentTab = 'image';
let uploadedImage = null;
let uploadedImageAspect = null;

function parseData(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (lines.length === 0) return { headers: [], rows: [] };
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const parseLine = (line) => line.split(sep).map(s => s.trim());
  return {
    headers: parseLine(lines[0]),
    rows: lines.slice(1).map(parseLine)
  };
}

function parseNum(s) {
  if (!s) return 0;
  const clean = String(s).replace(/[$,%\s]/g, '');
  let mult = 1;
  let val = clean;
  if (/B$/i.test(clean)) { mult = 1e9; val = clean.slice(0,-1); }
  else if (/M$/i.test(clean)) { mult = 1e6; val = clean.slice(0,-1); }
  else if (/K$/i.test(clean)) { mult = 1e3; val = clean.slice(0,-1); }
  const n = parseFloat(val);
  return isNaN(n) ? 0 : n * mult;
}

function formatNum(n) {
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n/1e9).toFixed(abs >= 1e10 ? 0 : 1) + 'B';
  if (abs >= 1e6) return (n/1e6).toFixed(abs >= 1e7 ? 0 : 1) + 'M';
  if (abs >= 1e3) return (n/1e3).toFixed(abs >= 1e4 ? 0 : 1) + 'K';
  if (abs < 10 && abs > 0) return n.toFixed(2);
  return Math.round(n).toLocaleString();
}

function escapeXml(s) {
  return String(s || '').replace(/[<>&"']/g, c => ({
    '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;'
  })[c]);
}

function getRowHeight() {
  const density = document.getElementById('tableDensity').value;
  if (density === 'compact') return 60;
  if (density === 'relaxed') return 100;
  return 80;
}

function charLen(text) {
  let n = 0;
  for (const c of String(text)) {
    n += /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(c) ? 1 : 0.55;
  }
  return n;
}

function wrapText(text, maxChars) {
  const raw = String(text || '');
  const forced = raw.split('|');
  const lines = [];
  forced.forEach(chunk => {
    const words = chunk.trim().split(/\s+/);
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (charLen(test) <= maxChars) {
        cur = test;
      } else {
        if (cur) lines.push(cur);
        if (charLen(w) > maxChars) {
          let rem = w;
          while (charLen(rem) > maxChars) {
            let cnt = 0, cut = 0;
            for (let i = 0; i < rem.length; i++) {
              const cw = /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(rem[i]) ? 1 : 0.55;
              if (cnt + cw > maxChars) break;
              cnt += cw; cut++;
            }
            if (cut === 0) cut = 1;
            lines.push(rem.slice(0, cut));
            rem = rem.slice(cut);
          }
          cur = rem;
        } else {
          cur = w;
        }
      }
    }
    if (cur) lines.push(cur);
  });
  return lines.length ? lines : [''];
}

// Pixel-accurate wrap using canvas.measureText — for source text that needs to fill full frame width
let _wrapCanvas = null;
function wrapTextByWidth(text, maxWidthPx, fontSize, fontFamily) {
  if (!_wrapCanvas) _wrapCanvas = document.createElement('canvas');
  const ctx = _wrapCanvas.getContext('2d');
  ctx.font = `${fontSize}px ${fontFamily}`;
  const measure = (s) => ctx.measureText(s).width;

  const forced = String(text || '').split('|');
  const lines = [];
  forced.forEach(chunk => {
    const words = chunk.trim().split(/\s+/);
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (measure(test) <= maxWidthPx) {
        cur = test;
      } else {
        if (cur) lines.push(cur);
        // If a single word (e.g. URL) overflows, break at char boundary
        if (measure(w) > maxWidthPx) {
          let rem = w;
          while (measure(rem) > maxWidthPx) {
            let cut = rem.length;
            while (cut > 0 && measure(rem.slice(0, cut)) > maxWidthPx) cut--;
            if (cut === 0) cut = 1;
            lines.push(rem.slice(0, cut));
            rem = rem.slice(cut);
          }
          cur = rem;
        } else {
          cur = w;
        }
      }
    }
    if (cur) lines.push(cur);
  });
  return lines.length ? lines : [''];
}

function measureW(text, fontSize, weight) {
  if (!_wrapCanvas) _wrapCanvas = document.createElement('canvas');
  const ctx = _wrapCanvas.getContext('2d');
  ctx.font = `${weight} ${fontSize}px ${FONT}`;
  return ctx.measureText(String(text || '')).width;
}

// Subtitle sits beside the title when both fit on one line
function fitsInline(title, subtitle, frameW) {
  const tW = measureW(title || 'Graph Title', 42, 700);
  const sW = measureW(subtitle, 18, 400);
  return (tW + SUB_GAP + sW) <= (frameW - 2 * PAD);
}

function computeFrameH() {
  // Estimate extra height needed for long source (multi-line wrap)
  const source = document.getElementById('source').value;
  const date = document.getElementById('date').value;
  const sourceParts = [source, date].filter(x => x && String(x).trim());
  const sourceText = sourceParts.join(' · ');
  const srcFontSize = Math.round(Math.max(12, Math.min(15, 12 + (FRAME_W - 800) * 3 / 800)));
  const srcLineHeight = Math.round(srcFontSize * 1.5);
  const sourceMaxWidth = FRAME_W - 2 * PAD - 6;
  const sourceLines = sourceText ? wrapTextByWidth(sourceText, sourceMaxWidth, srcFontSize, FONT) : [];
  const extraSourceH = Math.max(0, (sourceLines.length - 1) * srcLineHeight);

  if (currentTab === 'table') {
    const { headers, rows } = parseData(document.getElementById('tableData').value);
    if (rows.length === 0) return 600 + extraSourceH;
    const cols = Math.max(1, headers.length);
    const tableW = FRAME_W - 2 * PAD;
    const colW = tableW / cols;
    const bodyFontSize = TABLE_BODY_FONT;
    const maxChars = Math.floor((colW - 40) / (bodyFontSize * 0.68));
    const rowH = getRowHeight();
    const lineHeight = TABLE_LINE_HEIGHT;
    const headerH = 76;
    let bodyH = 0;
    rows.forEach(row => {
      let maxLines = 1;
      row.forEach(cell => {
        const lines = wrapText(cell, maxChars);
        maxLines = Math.max(maxLines, lines.length);
      });
      bodyH += rowH + Math.max(0, maxLines - 1) * lineHeight;
    });
    const computed = CONTENT_TOP + headerH + bodyH + TABLE_SLACK + FOOTER_AREA + extraSourceH;
    return Math.max(600, Math.min(1800, computed));
  }
  return DEFAULT_FRAME_H + extraSourceH;
}

function svgFrame(title, subtitle, source, date, contentSvg, frameH) {

  // Source: concatenate and wrap into multiple lines
  const sourceParts = [source, date].filter(x => x && String(x).trim());
  const sourceText = sourceParts.join(' · ');
  // Font scales with frame width (12pt at narrow 800, 15pt at wide 1600)
  const sourceFontSize = Math.round(Math.max(12, Math.min(15, 12 + (FRAME_W - 800) * 3 / 800)));
  const sourceLineHeight = Math.round(sourceFontSize * 1.5);
  const sourceMaxWidth = FRAME_W - 2 * PAD - 6;
  const sourceLines = sourceText ? wrapTextByWidth(sourceText, sourceMaxWidth, sourceFontSize, FONT) : [];
  const sourceBottomY = frameH - 35;
  const sourceStartY = sourceBottomY - (sourceLines.length - 1) * sourceLineHeight;

  const titleText = title || 'Graph Title';
  const subtitleSvg = !(subtitle && subtitle.trim())
    ? ''
    : (SUB_INLINE
        ? `<text x="${PAD - 4 + measureW(titleText, 42, 700) + SUB_GAP}" y="${TOP_PAD + 45}" font-size="18" fill="${MUTED}" font-family="${FONT}">${escapeXml(subtitle)}</text>`
        : `<text x="${PAD}" y="${TOP_PAD + 80}" font-size="18" fill="${MUTED}" font-family="${FONT}">${escapeXml(subtitle)}</text>`);

  const LOGO_SRC = `data:image/png;base64,${LOGO_B64}`;

  // Centered wide logo watermark
  const wmW = FRAME_W * WM_CENTER_W;
  const wmH = wmW / LOGO_ASPECT;
  const watermarkSvg = `<image href="${LOGO_SRC}" xlink:href="${LOGO_SRC}" x="${(FRAME_W - wmW) / 2}" y="${(frameH - wmH) / 2}" width="${wmW}" height="${wmH}" opacity="${WM_CENTER_OPACITY}" preserveAspectRatio="xMidYMid meet"/>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${FRAME_W} ${frameH}" font-family="${FONT}">
    <defs>
      <clipPath id="frameClip">
        <rect x="0" y="0" width="${FRAME_W}" height="${frameH}" rx="${CORNER}" ry="${CORNER}"/>
      </clipPath>
    </defs>
    <rect x="0.5" y="0.5" width="${FRAME_W - 1}" height="${frameH - 1}" rx="${CORNER}" ry="${CORNER}" fill="${FRAME_BG}" stroke="${FRAME_BORDER}" stroke-width="1"/>
    <rect x="0" y="0" width="${FRAME_BAR_W}" height="${frameH}" fill="${ACCENT}" clip-path="url(#frameClip)"/>
    <text x="${PAD - 4}" y="${TOP_PAD + 45}" font-size="42" font-weight="700" fill="${INK}" font-family="${FONT}">${escapeXml(titleText)}</text>
    ${subtitleSvg}
    ${contentSvg}
    ${watermarkSvg}
    ${sourceLines.length ? `<text x="${PAD}" y="${sourceStartY}" font-size="${sourceFontSize}" fill="${MUTED}" font-family="${FONT}">${sourceLines.map((line, i) => `<tspan x="${PAD}" ${i === 0 ? '' : `dy="${sourceLineHeight}"`}>${escapeXml(line)}</tspan>`).join('')}</text>` : ''}
  </svg>`;
}

function svgImage(dataUrl, frameH) {
  const contentBottom = frameH - FOOTER_AREA;
  const contentH = contentBottom - CONTENT_TOP;
  const contentW = FRAME_W - 2 * PAD;
  if (!dataUrl) {
    return `<text x="${PAD + contentW/2}" y="${CONTENT_TOP + contentH/2}" 
            text-anchor="middle" font-size="16" fill="${MUTED}" font-family="${FONT}">
            좌측에서 이미지를 업로드하세요
          </text>`;
  }
  return `<image href="${dataUrl}" xlink:href="${dataUrl}"
          x="${PAD}" y="${CONTENT_TOP}" 
          width="${contentW}" height="${contentH}"
          preserveAspectRatio="xMidYMid meet"/>`;
}

function svgLineChart(text, filled, frameH) {
  const contentBottom = frameH - FOOTER_AREA;
  const contentH = contentBottom - CONTENT_TOP;
  const contentW = FRAME_W - 2 * PAD;

  const { headers, rows } = parseData(text);
  if (rows.length === 0) {
    return `<text x="${PAD + contentW/2}" y="${CONTENT_TOP + contentH/2}" 
            text-anchor="middle" font-size="16" fill="${MUTED}" font-family="${FONT}">데이터를 입력하세요</text>`;
  }

  const labels = rows.map(r => r[0]);
  const series = headers.slice(1).map((name, i) => ({
    name,
    color: PALETTE[i % PALETTE.length],
    values: rows.map(r => parseNum(r[i + 1]))
  }));

  const allVals = series.flatMap(s => s.values);
  let yMin = Math.min(0, ...allVals);
  let yMax = Math.max(...allVals);
  if (yMax === yMin) yMax = yMin + 1;
  const range = yMax - yMin;
  yMax += range * 0.1;

  const cX = PAD + 90;
  const cY = CONTENT_TOP + 70;
  const cW = contentW - 120;
  const cH = contentH - 140;

  const xScale = i => labels.length > 1 ? cX + (i / (labels.length - 1)) * cW : cX + cW/2;
  const yScale = v => cY + cH - ((v - yMin) / (yMax - yMin)) * cH;

  // Per-series gradient defs (deep dark top → transparent bottom)
  let defs = '';
  if (filled) {
    series.forEach((s, si) => {
      if (si === 0) {
        // Primary: intense — dark navy top, royal blue mid, transparent bottom
        defs += `<linearGradient id="areaFill_${si}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${darken(s.color, 0.55)}" stop-opacity="1"/>
          <stop offset="45%" stop-color="${s.color}" stop-opacity="0.78"/>
          <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
        </linearGradient>`;
      } else {
        // Secondary series: still solid, but subtler so it doesn't muddy the primary
        defs += `<linearGradient id="areaFill_${si}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${darken(s.color, 0.7)}" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
        </linearGradient>`;
      }
    });
  }

  let out = filled ? `<defs>${defs}</defs>` : '';

  for (let i = 0; i <= 5; i++) {
    const val = yMin + (yMax - yMin) * (i / 5);
    const y = yScale(val);
    out += `<line x1="${cX}" y1="${y}" x2="${cX + cW}" y2="${y}" stroke="${GRID}" stroke-width="1" stroke-opacity="0.55"/>`;
    out += `<text x="${cX - 14}" y="${y + 5}" text-anchor="end" font-size="14" fill="${MUTED}" font-family="${FONT}">${formatNum(val)}</text>`;
  }

  if (yMin < 0 && yMax > 0) {
    out += `<line x1="${cX}" y1="${yScale(0)}" x2="${cX + cW}" y2="${yScale(0)}" stroke="${INK}" stroke-width="1"/>`;
  }

  const step = Math.max(1, Math.ceil(labels.length / 12));
  labels.forEach((label, i) => {
    if (i % step !== 0 && i !== labels.length - 1) return;
    out += `<text x="${xScale(i)}" y="${cY + cH + 32}" text-anchor="middle" font-size="14" fill="${MUTED}" font-family="${FONT}">${escapeXml(label)}</text>`;
  });

  series.forEach((s, si) => {
    if (filled) {
      const areaPath = s.values.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`).join(' ')
        + ` L ${xScale(s.values.length - 1)} ${yScale(yMin)} L ${xScale(0)} ${yScale(yMin)} Z`;
      out += `<path d="${areaPath}" fill="url(#areaFill_${si})"/>`;
    }
    const linePath = s.values.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`).join(' ');
    out += `<path d="${linePath}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.values.length <= 40) {
      const mSize = 9;
      s.values.forEach((v, i) => {
        out += `<rect x="${xScale(i) - mSize/2}" y="${yScale(v) - mSize/2}" width="${mSize}" height="${mSize}" fill="${s.color}"/>`;
      });
    }
  });

  if (series.length > 1) {
    const legendY = CONTENT_TOP + 34;
    const startX = cX + cW - series.length * 150;
    series.forEach((s, i) => {
      const x = startX + i * 150;
      // Line + centered square marker (matches line chart visual)
      out += `<line x1="${x}" y1="${legendY - 2}" x2="${x + 24}" y2="${legendY - 2}" stroke="${s.color}" stroke-width="2.6"/>`;
      out += `<rect x="${x + 8}" y="${legendY - 6}" width="8" height="8" fill="${s.color}"/>`;
      out += `<text x="${x + 32}" y="${legendY + 3}" font-size="14" fill="${INK}" font-family="${FONT}">${escapeXml(s.name)}</text>`;
    });
  }

  return out;
}

function svgBarChart(text, frameH) {
  const contentBottom = frameH - FOOTER_AREA;
  const contentH = contentBottom - CONTENT_TOP;
  const contentW = FRAME_W - 2 * PAD;

  const { headers, rows } = parseData(text);
  if (rows.length === 0) {
    return `<text x="${PAD + contentW/2}" y="${CONTENT_TOP + contentH/2}" 
            text-anchor="middle" font-size="16" fill="${MUTED}" font-family="${FONT}">데이터를 입력하세요</text>`;
  }

  const labels = rows.map(r => r[0]);
  const series = headers.slice(1).map((name, i) => ({
    name,
    color: PALETTE[i % PALETTE.length],
    values: rows.map(r => parseNum(r[i + 1]))
  }));

  const allVals = series.flatMap(s => s.values);
  let yMin = Math.min(0, ...allVals);
  let yMax = Math.max(...allVals);
  if (yMax === yMin) yMax = yMin + 1;
  const range = yMax - yMin;
  yMax += range * 0.1;

  const cX = PAD + 90;
  const cY = CONTENT_TOP + 70;
  const cW = contentW - 120;
  const cH = contentH - 140;

  const groupW = cW / labels.length;
  const barW = Math.min(80, (groupW * 0.7) / series.length);

  const yScale = v => cY + cH - ((v - yMin) / (yMax - yMin)) * cH;

  let out = '';

  const yTicks = 5;
  for (let i = 0; i <= yTicks; i++) {
    const val = yMin + (yMax - yMin) * (i / yTicks);
    const y = yScale(val);
    out += `<line x1="${cX}" y1="${y}" x2="${cX + cW}" y2="${y}" stroke="${GRID}" stroke-width="1" stroke-opacity="0.55"/>`;
    out += `<text x="${cX - 14}" y="${y + 5}" text-anchor="end" font-size="14" fill="${MUTED}" font-family="${FONT}">${formatNum(val)}</text>`;
  }

  if (yMin < 0 && yMax > 0) {
    out += `<line x1="${cX}" y1="${yScale(0)}" x2="${cX + cW}" y2="${yScale(0)}" stroke="${INK}" stroke-width="1"/>`;
  }

  labels.forEach((label, li) => {
    const groupCenter = cX + groupW * li + groupW / 2;
    series.forEach((s, si) => {
      const val = s.values[li];
      const barX = groupCenter - (series.length * barW) / 2 + si * barW + 2;
      const barTop = yScale(Math.max(0, val));
      const barBot = yScale(Math.min(0, val));
      const barH = Math.max(1, Math.abs(barBot - barTop));
      out += `<rect x="${barX}" y="${barTop}" width="${barW - 4}" height="${barH}" fill="${s.color}"/>`;
      if (series.length <= 3) {
        out += `<text x="${barX + (barW-4)/2}" y="${barTop - 8}" text-anchor="middle" font-size="12" fill="${MUTED}" font-family="${FONT}">${formatNum(val)}</text>`;
      }
    });
    out += `<text x="${groupCenter}" y="${cY + cH + 32}" text-anchor="middle" font-size="14" fill="${MUTED}" font-family="${FONT}">${escapeXml(label)}</text>`;
  });

  if (series.length > 1) {
    const legendY = CONTENT_TOP + 34;
    const startX = cX + cW - series.length * 150;
    series.forEach((s, i) => {
      const x = startX + i * 150;
      out += `<rect x="${x}" y="${legendY - 8}" width="18" height="12" fill="${s.color}"/>`;
      out += `<text x="${x + 26}" y="${legendY + 2}" font-size="14" fill="${INK}" font-family="${FONT}">${escapeXml(s.name)}</text>`;
    });
  }

  return out;
}

function svgTable(text, frameH) {
  const { headers, rows } = parseData(text);
  const contentBottom = frameH - FOOTER_AREA;
  const contentH = contentBottom - CONTENT_TOP;
  const contentW = FRAME_W - 2 * PAD;

  if (rows.length === 0) {
    return `<text x="${PAD + contentW/2}" y="${CONTENT_TOP + contentH/2}" 
            text-anchor="middle" font-size="16" fill="${MUTED}" font-family="${FONT}">데이터를 입력하세요</text>`;
  }

  const cols = headers.length;
  const tableW = contentW;
  const tableX = PAD;
  const colW = tableW / cols;
  const rowH = getRowHeight();
  const headerH = 76;
  const CELL_CORNER = 12;
  const bodyFontSize = TABLE_BODY_FONT;
  const maxChars = Math.floor((colW - 40) / (bodyFontSize * 0.68));
  const lineHeight = TABLE_LINE_HEIGHT;

  const rowInfo = rows.map(row => {
    let maxLines = 1;
    const wrapped = row.map(cell => {
      const lines = wrapText(cell, maxChars);
      maxLines = Math.max(maxLines, lines.length);
      return lines;
    });
    return { wrapped, h: rowH + Math.max(0, maxLines - 1) * lineHeight };
  });

  const bodyH = rowInfo.reduce((a, r) => a + r.h, 0);
  const totalH = headerH + bodyH;
  const tableY = CONTENT_TOP + Math.max(0, (contentH - totalH) / 2);

  let out = '';

  // Header (rounded top)
  out += `<path d="M ${tableX + CELL_CORNER} ${tableY} 
                   L ${tableX + tableW - CELL_CORNER} ${tableY} 
                   Q ${tableX + tableW} ${tableY} ${tableX + tableW} ${tableY + CELL_CORNER}
                   L ${tableX + tableW} ${tableY + headerH}
                   L ${tableX} ${tableY + headerH}
                   L ${tableX} ${tableY + CELL_CORNER}
                   Q ${tableX} ${tableY} ${tableX + CELL_CORNER} ${tableY} Z" 
           fill="${ACCENT}"/>`;

  // Header dividers
  for (let i = 1; i < cols; i++) {
    const x = tableX + colW * i;
    out += `<line x1="${x}" y1="${tableY + 14}" x2="${x}" y2="${tableY + headerH - 14}" 
                  stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>`;
  }

  // Header text
  headers.forEach((h, i) => {
    const cx = tableX + colW * i + colW / 2;
    out += `<text x="${cx}" y="${tableY + headerH/2 + 6}" text-anchor="middle" 
                  font-size="${TABLE_HEADER_FONT}" font-weight="700" letter-spacing="${TABLE_HEADER_TRACKING}" fill="#FFFFFF" font-family="${FONT}">${escapeXml(h)}</text>`;
  });

  // Body
  let yCursor = tableY + headerH;
  rowInfo.forEach((info, ri) => {
    const y = yCursor;
    const h = info.h;

    out += `<rect x="${tableX}" y="${y}" width="${tableW}" height="${h}" fill="#FFFFFF"/>`;

    for (let ci = 1; ci < cols; ci++) {
      const x = tableX + colW * ci;
      out += `<line x1="${x}" y1="${y + 12}" x2="${x}" y2="${y + h - 12}" 
                    stroke="#E5E5E5" stroke-width="1"/>`;
    }

    if (ri < rows.length - 1) {
      out += `<line x1="${tableX + 20}" y1="${y + h}" x2="${tableX + tableW - 20}" y2="${y + h}" 
                    stroke="#E5E5E5" stroke-width="1"/>`;
    }

    info.wrapped.forEach((lines, ci) => {
      const cx = tableX + colW * ci + colW / 2;
      const totalLines = lines.length;
      const blockTop = y + h/2 - (totalLines * lineHeight) / 2 + lineHeight - 8;
      lines.forEach((line, li) => {
        out += `<text x="${cx}" y="${blockTop + li * lineHeight}" text-anchor="middle" 
                      font-size="${bodyFontSize}" font-weight="400" fill="${INK}" font-family="${FONT}">${escapeXml(line)}</text>`;
      });
    });

    yCursor += h;
  });

  // Closing rule — same inset as the row dividers so it reads as part of the grid
  out += `<line x1="${tableX + 20}" y1="${tableY + totalH}" x2="${tableX + tableW - 20}" y2="${tableY + totalH}" 
                stroke="#E5E5E5" stroke-width="1"/>`;

  return out;
}

function render() {
  const title = document.getElementById('title').value;
  const subtitle = document.getElementById('subtitle').value;
  const source = document.getElementById('source').value;
  const date = document.getElementById('date').value;

  ACCENT = document.getElementById('accentColor').value.toUpperCase();

  // No source/date → collapse the footer so the content extends further down
  const hasSource = [source, date].some(x => x && String(x).trim());
  FOOTER_AREA = hasSource ? FOOTER_WITH_SOURCE : FOOTER_NO_SOURCE;

  const hasSub = !!(subtitle && subtitle.trim());

  // Frame width depends on CONTENT_TOP (image tab), which depends on where the
  // subtitle lands — so resolve width, then placement, then width again.
  const applyWidth = () => {
    if (currentTab === 'image' && uploadedImage && uploadedImageAspect) {
      const contentH = DEFAULT_FRAME_H - CONTENT_TOP - FOOTER_AREA;
      const naturalContentW = contentH * uploadedImageAspect;
      FRAME_W = Math.min(FRAME_W_MAX, Math.max(FRAME_W_MIN, Math.round(naturalContentW + 2 * PAD)));
    } else {
      FRAME_W = FRAME_W_MAX;
    }
  };

  CONTENT_TOP = hasSub ? CONTENT_TOP_WITH_SUB : CONTENT_TOP_NO_SUB;
  applyWidth();

  SUB_INLINE = hasSub && fitsInline(title, subtitle, FRAME_W);

  // Inline subtitle costs no extra height, so the content block starts higher
  CONTENT_TOP = (hasSub && !SUB_INLINE) ? CONTENT_TOP_WITH_SUB : CONTENT_TOP_NO_SUB;
  applyWidth();

  const frameH = computeFrameH();

  let contentSvg = '';
  if (currentTab === 'image') {
    contentSvg = svgImage(uploadedImage, frameH);
  } else if (currentTab === 'chart') {
    const chartType = document.getElementById('chartType').value;
    const data = document.getElementById('chartData').value;
    if (chartType === 'line') contentSvg = svgLineChart(data, false, frameH);
    else if (chartType === 'area') contentSvg = svgLineChart(data, true, frameH);
    else if (chartType === 'bar') contentSvg = svgBarChart(data, frameH);
  } else if (currentTab === 'table') {
    contentSvg = svgTable(document.getElementById('tableData').value, frameH);
  }

  const svg = svgFrame(title, subtitle, source, date, contentSvg, frameH);
  document.getElementById('preview').innerHTML = svg;
  document.getElementById('previewLabel').textContent = `Preview · ${FRAME_W} × ${Math.round(frameH)}`;
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
    document.getElementById('tab-' + currentTab).style.display = 'block';
    render();
  });
});

// --- Key color: preset / picker / hex-rgb text stay in sync -----------------
// The <input type="color"> holds the canonical value; render() reads it.
function parseColor(str) {
  const s = String(str == null ? '' : str).trim();
  if (!s) return null;

  let m = s.match(/^#?([0-9a-f])([0-9a-f])([0-9a-f])$/i);
  if (m) return ('#' + m[1] + m[1] + m[2] + m[2] + m[3] + m[3]).toUpperCase();

  m = s.match(/^#?([0-9a-f]{6})$/i);
  if (m) return ('#' + m[1]).toUpperCase();

  // rgb(35,50,220) / rgba(35 50 220 / 0.5) — alpha is parsed but dropped, the
  // SVG fills here are opaque.
  m = s.match(/^rgba?\(\s*([\d.]+%?)[\s,]+([\d.]+%?)[\s,]+([\d.]+%?)\s*(?:[,\/]\s*[\d.]+%?\s*)?\)$/i);
  if (m) {
    const channel = (v) => {
      const n = parseFloat(v);
      if (!isFinite(n)) return null;
      const scaled = v.endsWith('%') ? (n * 255) / 100 : n;
      return Math.max(0, Math.min(255, Math.round(scaled)));
    };
    const rgb = [m[1], m[2], m[3]].map(channel);
    if (rgb.some(v => v === null)) return null;
    return '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  }

  return null;
}

function applyAccent(hex, opts) {
  const keepText = !!(opts && opts.keepText);
  const picker = document.getElementById('accentColor');
  const text = document.getElementById('accentText');
  const preset = document.getElementById('accentPreset');

  picker.value = hex;
  if (!keepText) text.value = hex;
  text.classList.remove('invalid');

  const known = Array.from(preset.options).some(o => o.value.toUpperCase() === hex);
  preset.value = known ? hex : 'custom';

  render();
}

document.getElementById('accentPreset').addEventListener('change', (e) => {
  const text = document.getElementById('accentText');
  if (e.target.value === 'custom') {
    text.focus();
    text.select();
    return;
  }
  applyAccent(e.target.value.toUpperCase());
});

document.getElementById('accentColor').addEventListener('input', (e) => {
  applyAccent(e.target.value.toUpperCase());
});

document.getElementById('accentText').addEventListener('input', (e) => {
  const hex = parseColor(e.target.value);
  // Mid-typing values ("#23") are invalid — flag them, but leave the last good
  // color in place instead of resetting the preview.
  if (!hex) { e.target.classList.add('invalid'); return; }
  applyAccent(hex, { keepText: true });
});

document.getElementById('accentText').addEventListener('blur', (e) => {
  const hex = parseColor(e.target.value);
  e.target.value = hex || document.getElementById('accentColor').value.toUpperCase();
  e.target.classList.remove('invalid');
});

['title', 'subtitle', 'source', 'date', 'chartData', 'chartType', 'tableData', 'tableDensity'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', render);
  if (el) el.addEventListener('change', render);
});

document.getElementById('imgUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    uploadedImage = reader.result;
    // Detect image aspect ratio to fit frame
    const probe = new Image();
    probe.onload = () => {
      uploadedImageAspect = probe.width / probe.height;
      render();
    };
    probe.onerror = () => {
      uploadedImageAspect = null;
      render();
    };
    probe.src = reader.result;
  };
  reader.readAsDataURL(file);
});

function loadSample(kind) {
  const el = document.getElementById('chartData');
  const typeEl = document.getElementById('chartType');
  if (kind === 'line1') {
    el.value = `Month,Polymarket,Kalshi
H1 2023,0.03,0.2
H2 2023,0.04,0.6
H1 2024,0.5,0.6

H2 2025,15,18`;
    typeEl.value = 'line';
  } else if (kind === 'bar1') {
    el.value = `카테고리,비중

경제,5.1
대중문화,8.9`;
    typeEl.value = 'bar';
  }
  render();
}
window.loadSample = loadSample;

async function downloadPNG() {
  const svg = document.querySelector('#preview svg');
  if (!svg) return;

  const vb = svg.getAttribute('viewBox').split(' ');
  const w = parseFloat(vb[2]);
  const h = parseFloat(vb[3]);

  const scale = 2;
  const svgString = new XMLSerializer().serializeToString(svg);
  const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);

  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    // Transparent background — rounded corners stay clean over any doc background
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
      const link = document.createElement('a');
      const title = document.getElementById('title').value || 'chart';
      link.download = `hor_${title.replace(/\s+/g, '_').replace(/[^\w가-힣_-]/g, '')}.png`;
      link.href = URL.createObjectURL(blob);
      link.click();
      URL.revokeObjectURL(link.href);
      URL.revokeObjectURL(url);
    }, 'image/png');
  };
  img.src = url;
}

async function downloadSVG() {
  const svg = document.querySelector('#preview svg');
  if (!svg) return;
  const svgString = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
  const link = document.createElement('a');
  const title = document.getElementById('title').value || 'chart';
  link.download = `hor_${title.replace(/\s+/g, '_').replace(/[^\w가-힣_-]/g, '')}.svg`;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

window.downloadPNG = downloadPNG;
window.downloadSVG = downloadSVG;

render();
